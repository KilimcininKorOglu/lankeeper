name: Release

# A pushed vX.Y.Z tag builds the shipped artifacts here, signs SHA256SUMS
# and publishes the GitHub Release. Nothing is uploaded from the
# maintainer's machine.
#
# The build jobs hold no secret and no write permission. Only the publish
# job reads the signing key, and it runs in the `release` environment,
# which admits v* tags only and waits for the maintainer's approval. The
# version-update skill gives that approval once ci.yml is green on the
# tagged commit, so a commit that failed CI is never signed. Whoever can
# push a tag AND approve that environment can publish a signed release;
# the environment is what keeps a tag push alone from being enough.
#
# workflow_dispatch runs the build jobs alone, as a dry run of the ISO
# pipeline. The publish job is skipped outside a tag push.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            # Native arm64. The ISO builder runs apt and xorriso inside a
            # linux/arm64 container, which QEMU emulation would slow down
            # several times over.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The Makefile stamps the version from git describe --tags, so
          # the tag and its history have to be present.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # The same range ci.yml tests with, so the shipped binary is
          # built by the toolchain govulncheck measured.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Check the tag names a clean release
        if: github.event_name == 'push'
        # The artifact names and the stamped version both come from git
        # describe. A tag it does not resolve to exactly would publish
        # files named after something else, and the updater matches
        # assets by name.
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
            exit 1
          fi
          described=$(git describe --tags --always --dirty)
          if [[ "$described" != "$GITHUB_REF_NAME" ]]; then
            echo "git describe gives $described, not $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build the tarball and the installer ISO
        # iso-$ARCH downloads the Debian source image when it is missing;
        # build-iso.sh checks it against deploy/iso/debian-images.sha512.
        run: make "release-$ARCH" "iso-$ARCH"

      - name: Stage the artifacts
        run: |
          set -euo pipefail
          version=$(git describe --tags --always --dirty)
          mkdir -p out
          mv "dist/lankeeper-$version-linux-$ARCH.tar.gz" \
             "dist/lankeeper-$version-installer-$ARCH.iso" out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          # The tarball and the ISO are compressed already.
          compression-level: 0
          # The publish job reads these within the same run; the cleanup
          # workflow deletes whatever is left.
          retention-days: 1

  publish:
    name: sign and publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Check the artifact set
        run: |
          set -euo pipefail
          for f in "lankeeper-$GITHUB_REF_NAME-linux-amd64.tar.gz" \
                   "lankeeper-$GITHUB_REF_NAME-linux-arm64.tar.gz" \
                   "lankeeper-$GITHUB_REF_NAME-installer-amd64.iso" \
                   "lankeeper-$GITHUB_REF_NAME-installer-arm64.iso"; do
            if [ ! -s "dist/$f" ]; then
              echo "missing artifact: $f" >&2
              exit 1
            fi
          done

      - name: Write SHA256SUMS and the release notes
        run: |
          set -euo pipefail
          make checksums "VERSION=$GITHUB_REF_NAME"
          make release-notes "VERSION=$GITHUB_REF_NAME"

      - name: Sign SHA256SUMS
        # signrelease refuses a key whose signature does not verify
        # against the public key compiled into the router, so a wrong
        # secret stops here instead of publishing a release every router
        # rejects. The key file lives only for this step.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/release-signing.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key")
          make sign "SIGNING_KEY=$key"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/RELEASE_NOTES.md \
            "dist/lankeeper-$GITHUB_REF_NAME-linux-amd64.tar.gz" \
            "dist/lankeeper-$GITHUB_REF_NAME-linux-arm64.tar.gz" \
            "dist/lankeeper-$GITHUB_REF_NAME-installer-amd64.iso" \
            "dist/lankeeper-$GITHUB_REF_NAME-installer-arm64.iso" \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig

      - name: Check the published assets
        # The updater finds its download by asset name, so a release
        # missing one of these reaches every router as an update that
        # cannot be applied.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          got=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name] | sort | join(" ")')
          want=$(printf '%s\n' \
            "lankeeper-$GITHUB_REF_NAME-installer-amd64.iso" \
            "lankeeper-$GITHUB_REF_NAME-installer-arm64.iso" \
            "lankeeper-$GITHUB_REF_NAME-linux-amd64.tar.gz" \
            "lankeeper-$GITHUB_REF_NAME-linux-arm64.tar.gz" \
            SHA256SUMS SHA256SUMS.sig | LC_ALL=C sort | paste -sd ' ' -)
          if [ "$got" != "$want" ]; then
            echo "published assets: $got" >&2
            echo "expected:         $want" >&2
            exit 1
          fi
