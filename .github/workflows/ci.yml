name: CI

# Push/PR to main runs the same gates a developer would: compile, race
# tests, golangci-lint, go vet, govulncheck against vuln.go.dev, gosec,
# and the cross-compile that produces the shipped artifacts.
# Keep these aligned with the Makefile so contributors can reproduce
# every failure locally with `make test lint cross-all`, plus
# `govulncheck ./...` and `gosec ./...` for the two security gates the
# Makefile does not wrap.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Track the newest patch of the minor release go.mod declares.
          #
          # This used to read go-version-file: go.mod, and a fully
          # qualified patch version in that directive makes the action
          # install exactly that release. CI then evaluated a frozen
          # standard library, so govulncheck failed on every branch over
          # stdlib advisories that had already been patched upstream,
          # including the branches whose only purpose was to fix
          # dependency advisories. go.mod still carries the floor; this
          # keeps the gate measuring the code under review.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race + count=1)
        # Mirror `make test` — never invoke `go test` directly outside
        # CI, but the Makefile target adds nothing useful in CI so we
        # call go test inline to keep the matrix readable.
        run: go test ./... -race -count=1

      - name: go vet
        run: go vet ./...

  cross-compile:
    # The build job above compiles for the runner's own platform with
    # cgo on and no ldflags. Release artifacts are built by the Makefile
    # with CGO_ENABLED=0, an explicit GOARCH and the version ldflags, and
    # nothing exercised that combination until release-cut time. Routers
    # pull whatever lands on the latest release, so a cross-compile break
    # discovered there lands directly on the step that ships to them.
    name: cross-compile (amd64 + arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The ldflags read git describe --tags; without the full
          # history the version string degrades to a bare SHA and the
          # job stops resembling a real release build.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # See build-test for why this is a range, not go.mod.
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build shipped artifacts
        run: make cross-all

      - name: Verify both artifacts exist and target the right machine
        # Guards against a recipe that succeeds without writing anything,
        # or writes for the wrong GOARCH.
        run: |
          set -euo pipefail
          for spec in "dist/lankeeper-linux-amd64:x86-64" "dist/lankeeper-linux-arm64:aarch64"; do
            path="${spec%:*}"
            want="${spec##*:}"
            if [ ! -s "$path" ]; then
              echo "missing or empty artifact: $path" >&2
              exit 1
            fi
            desc=$(file -b "$path")
            echo "$path: $desc"
            case "$desc" in
              *"$want"*) ;;
              *) echo "expected $want in the description above" >&2; exit 1 ;;
            esac
          done

      - name: Run the amd64 artifact and check its stamped version
        # The runner is linux/amd64, so the shipped amd64 binary runs
        # here directly. This proves the static build actually executes
        # and that the -X ldflags landed: a dropped one leaves the binary
        # reporting "dev", which is the string the updater compares
        # releases against.
        run: |
          set -euo pipefail
          out=$(./dist/lankeeper-linux-amd64 version)
          echo "$out"
          case "$out" in
            *"lankeeper dev"*|*"commit: unknown"*)
              echo "version ldflags were not applied" >&2; exit 1 ;;
          esac

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # See build-test for why this is a range, not go.mod.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      # Pinned to a commit, not a tag. A tag can be repointed by whoever
      # controls the publishing account, so a tag-pinned third-party
      # action can change what runs here without any commit appearing in
      # this repository. The actions/* references above are GitHub's own
      # and stay on tags so Dependabot keeps producing readable bumps.
      #
      # Update by resolving the new tag to its commit before editing:
      #   gh api repos/golangci/golangci-lint-action/git/ref/tags/vN
      # and, when that returns an annotated tag object, dereferencing it:
      #   gh api repos/golangci/golangci-lint-action/git/tags/<sha>
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # An explicit version, not `latest`. With `latest` the gate
          # could start or stop failing with no change to the tree,
          # which makes a red build hard to bisect and a green one worth
          # less. It also keeps CI on the same release `make lint` runs
          # locally, so a contributor reproduces what CI saw.
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # See build-test for why this is a range, not go.mod.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Install govulncheck
        # An explicit version, for the same reproducibility reason as
        # the linter above. Pinning the tool does not stale the
        # advisories: govulncheck queries https://vuln.go.dev at run
        # time, so the database stays current regardless of which
        # release of the binary asks it. Freshness belongs to the data,
        # not to the tool.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Scan
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          # See build-test for why this is a range, not go.mod.
          go-version: '1.26.x'
          check-latest: true
          cache: true
      - name: Install gosec
        # Pinned like the other tools. gosec differs from govulncheck in
        # that its rules ship in the binary, so an unpinned upgrade adds
        # rules that fail this gate with no change to the tree. Bump it
        # deliberately and triage the new findings in that commit.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Scan
        # Every finding this reports today is annotated at the line with
        # a justification, so a non-zero exit means something genuinely
        # new. Read the annotation before adding another one.
        run: gosec ./...
