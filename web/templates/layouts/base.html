<!DOCTYPE html>
<html lang="{{ .Lang }}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t .Lang "app.title" }}</title>
    <link rel="stylesheet" href="/static/css/reset.css">
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/app.js" defer></script>
    <script src="/static/js/ui.js" defer></script>
    <script src="/static/js/qrcode.js" defer></script>
    <script src="/static/js/qr-modal.js" defer></script>
</head>
<body>
    <div class="app-layout">
        {{ template "sidebar" . }}
        <main class="content-area">
            {{ block "content" . }}{{ end }}
        </main>
        <aside class="panel">
            {{ block "panel" . }}{{ end }}
        </aside>
    </div>
    <div class="toast-container" id="toast-container"></div>
    <div class="modal-overlay" id="qr-modal" hidden
         data-title="{{ t .Lang "qr.title" }}"
         data-loading="{{ t .Lang "qr.loading" }}"
         data-too-large="{{ t .Lang "qr.tooLarge" }}"
         data-failed="{{ t .Lang "qr.failed" }}">
        <div class="modal">
            <div class="modal-header">
                <span class="card-title" id="qr-modal-title"></span>
                <button class="btn btn-secondary btn-sm" data-qr-close>{{ t .Lang "common.close" }}</button>
            </div>
            <canvas id="qr-canvas" class="qr-canvas" width="1" height="1"></canvas>
            <p class="modal-note" id="qr-modal-note"></p>
            <p class="modal-hint">{{ t .Lang "qr.hint" }}</p>
        </div>
    </div>
</body>
</html>
